name: FTP Deploy

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.git/**'
      - '.github/**'
      - '**.md'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Remove Git Files
        run: |
          rm -rf .git
          rm -rf .github
          rm -f .gitignore
          rm -f .gitattributes
          rm -f .editorconfig

      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          security: loose
          server-dir: /www/lms/
          exclude: |
            **/.git*
            **/.github/**
            **/.env*
            **/*.log
            application/cache/**
            application/logs/**